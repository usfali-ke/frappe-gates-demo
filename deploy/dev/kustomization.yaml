# dev: the first environment a build reaches. devsecops-release.yml
# (environment: dev) commits the digest main's pipeline built, after G5.
# Argo CD app `frappe-gates-demo-dev` syncs it with selfHeal.
# The only automated edit is the image digest below (set_digest.py).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: frappe-gates-demo-dev

resources:
  - ../base

patches:
  - target: {kind: Rollout, name: frappe-gates-demo}
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target: {kind: AnalysisTemplate, name: frappe-gates-demo-canary-health}
    patch: |
      - op: replace
        path: /spec/metrics/0/provider/web/url
        value: http://frappe-gates-demo-canary.frappe-gates-demo-dev.svc/api/method/frappe_gates_demo.api.health

images:
  # Never a tag: admission (Kyverno) requires digests. Every environment
  # starts at the digest prod already ran; promotion replaces it.
  - name: frappe-gates-demo
    newName: ghcr.io/usfali-ke/frappe-gates-demo
    digest: sha256:5c294d49e3c1cc1da7e6c1dbe02c806d3c4bdb2b1a8810040405fcd2d7b6e04c
