# What every environment runs. Not synced on its own: Argo CD syncs the
# overlays deploy/dev, deploy/staging and deploy/prod, which add the
# namespace, replica count and the promoted image digest.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - dependencies.yaml
  - rbac.yaml
  - services.yaml
  - analysistemplate.yaml
  - rollout.yaml
