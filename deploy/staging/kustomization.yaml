# staging: gets a digest that passed dev's Test phase, and nothing else.
# Argo CD app `frappe-gates-demo-stg` syncs it with selfHeal.
# The only automated edit is the image digest below (set_digest.py).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: frappe-gates-demo-stg

resources:
  - ../base

patches:
  # Test users for the authenticated suites (tests/env/env-up.sh) are
  # created through the app, with this token, instead of a shell in the pod
  # (no pods/exec: deploy/base/rbac.yaml). dev and staging only: prod never
  # has the token, so the provisioning call doesn't exist there. The Secret
  # is created by tests/env/env-runner.sh, never committed; optional, so a
  # cluster without it still deploys (the authenticated suites then fail
  # with "test-user provisioning is not enabled").
  - target: {kind: Rollout, name: frappe-gates-demo}
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: TEST_PROVISIONING_TOKEN
          valueFrom:
            secretKeyRef:
              name: frappe-gates-demo-test-provisioning
              key: token
              optional: true
  - target: {kind: Rollout, name: frappe-gates-demo}
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target: {kind: AnalysisTemplate, name: frappe-gates-demo-canary-health}
    patch: |
      - op: replace
        path: /spec/metrics/0/provider/web/url
        value: http://frappe-gates-demo-canary.frappe-gates-demo-stg.svc/api/method/frappe_gates_demo.api.health

images:
  # Never a tag: admission (Kyverno) requires digests. Every environment
  # starts at the digest prod already ran; promotion replaces it.
  - name: frappe-gates-demo
    newName: docker.io/alienke/frappe-gates-demo
    digest: sha256:7fa78b98477f354ef2850bef3ee024d1ee4f97bbdf92a756c3445df121080756
