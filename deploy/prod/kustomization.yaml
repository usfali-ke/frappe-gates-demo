# prod: gets only a digest that passed G3 in staging, and only after the
# release-approval review (job approve-prod). Argo CD app
# `frappe-gates-demo-prod` syncs it with selfHeal; nothing else writes to
# the namespace.
# The only automated edit is the image digest below (set_digest.py).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: frappe-gates-demo-prod

resources:
  - ../base

patches:
  - target: {kind: Rollout, name: frappe-gates-demo}
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  - target: {kind: AnalysisTemplate, name: frappe-gates-demo-canary-health}
    patch: |
      - op: replace
        path: /spec/metrics/0/provider/web/url
        value: http://frappe-gates-demo-canary.frappe-gates-demo-prod.svc/api/method/frappe_gates_demo.api.health

images:
  # Never a tag: admission (Kyverno) requires digests. Every environment
  # starts at the digest prod already ran; promotion replaces it.
  - name: frappe-gates-demo
    newName: ghcr.io/usfali-ke/frappe-gates-demo
    digest: sha256:0d2d76fbc86d2a4cf3087f04935ea5336d1afa876328ce12a0371a910b5bf463
