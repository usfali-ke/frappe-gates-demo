# Markers the release pipeline selects with -m (devsecops-stage.yml runs one
# suite per job; the marker names the control, the file names the suite).
[pytest]
testpaths = tests/live
markers =
    smoke: post-deploy read-only checks (safe in prod)
    integration: app contract against the deployed environment
    regression: the rules the app must keep enforcing
    e2e: the user journey through the real pages
    security: authenticated DAST (two real users)
    performance: k6-style latency checks
norecursedirs = reports .git frappe_gates_demo
