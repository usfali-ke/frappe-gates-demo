name: Accepted risks from the base branch
description: >-
  On pull requests, replace security/accepted-risks.json with the base branch's
  copy before a control's verdict, so a pull request cannot accept its own
  findings: an entry takes effect only once it is on the base branch, through
  its own reviewed change. Push and dispatch runs keep the checked-out file
  (it IS the base branch).
runs:
  using: composite
  steps:
    - if: startsWith(github.event_name, 'pull_request')
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        mkdir -p security
        head_copy=$(mktemp); cp security/accepted-risks.json "$head_copy" 2>/dev/null || echo '{}' > "$head_copy"
        code=$(curl -sS -o security/accepted-risks.base.json -w '%{http_code}' \
          -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
          "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/security/accepted-risks.json?ref=$BASE_SHA" || echo 000)
        case "$code" in
          200) mv security/accepted-risks.base.json security/accepted-risks.json ;;
          404) rm -f security/accepted-risks.base.json; echo '{"accepted": []}' > security/accepted-risks.json ;;
          *)   echo "::error::could not read the base branch's accepted risks (HTTP $code): refusing to use the PR's copy (fail-closed)"; exit 1 ;;
        esac
        if ! cmp -s "$head_copy" security/accepted-risks.json; then
          echo "::notice::This PR changes security/accepted-risks.json. Its entries take effect only after it is merged; this run uses the base branch's register."
        fi
