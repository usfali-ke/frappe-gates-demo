name: devsecops pipeline

# The frappe-gates-demo twin of the facility360 devsecops pipeline (one
# pipeline per app - the devsecops release standard): from a commit on the
# release branch (MAIN) to the signed GHCR image + git tag, in ONE run.
# Same shape, same shared library (devsecops-release-lib), same fail-closed
# control gate (REPORT-ONLY for CRITICAL/HIGH findings; a failed control or
# a missing/ungradeable report still blocks).
#
# This workflow COEXISTS with the repo's own gate ladder
# (devsecops-pipeline.yml / devsecops-release.yml / devsecops-stage.yml -
# the G1/G2 evidence ladder). It is the facility360-standard pipeline:
# 18-style shared-library controls, one report per control, the G2 control
# gate, the tag, and the DefDojo reporting push.
#
# Differences vs the facility360 reference (frappe-gates-demo specifics):
#   - Python/Frappe v15 app - the build is a docker buildx of the repo's
#     OWN Dockerfile (single stage on the digest-pinned bench base image
#     ghcr.io/usfali-ke/frappe-gates-demo-bench; COPY-only, reproducible)
#     - no Node/Next.js build, no kaniko, no build args.
#   - release branch = main (this app releases from main; the deploy/**
#     GitOps overlays track this repo's image).
#   - registry = GHCR (ghcr.io/usfali-ke/frappe-gates-demo - the app's
#     established identity: the deploy overlays pin it, the repo's own
#     ladder publishes there). NOT ECR: the image identity is the digest
#     recorded from the registry at build time (docker buildx imagetools
#     inspect) and re-verified at release before the tag; the AWS Inspector
#     control (ECR on-push scan) does not apply and is dropped.
#   - cosign: the shared release key (the COSIGN_KEY secret - the same
#     cosign-release-key the other apps sign with, so the Jenkins
#     gha-verify re-check verifies it with the same verifier), signed to
#     the GHCR registry after a GHCR login (the lib's cosign-sign is
#     registry-agnostic).
#   - quality control = ruff (the repo's pyproject [tool.ruff] config; in
#     the findings gate F/B rule codes grade HIGH, E/W MEDIUM, I/UP/RUF
#     LOW - REPORT-ONLY). The control job fails only when ruff cannot run
#     or produce its report (fail-closed control health); the findings
#     themselves are graded by the findings gate, like every other tool in
#     this pipeline.
#   - unit tests = the app's bench suite (the Frappe test runner against a
#     real MariaDB + Redis; the junit report is a GATE control). ENABLED:
#     the suite is green on main - unlike the facility360 e2e suite, which
#     is skipped (3 red tests).
#   - SCA (trivy fs) scans requirements.txt + pyproject.toml (trivy's
#     pip/python manifest detection).
#   - the release job triggers the Kargo warehouse refresh when
#     KARGO_WEBHOOK_URL is set (this app has no Kargo wiring yet - the step
#     is a no-op without the secret).
#
# Phases + controls: Develop (source, in parallel with the build): SAST
# (semgrep) - secrets (gitleaks, full history) - secrets (trufflehog,
# verified) - quality (ruff) - IaC (checkov Dockerfile) - SCA (trivy fs)
# - unit tests (bench suite, junit). Build: the buildx image (digest = the
# identity), then in parallel: cosign sign - trivy image scan - CIS
# (dockle) - SBOM (syft). G2: the fail-closed control gate (every required
# control succeeded + the findings gate, report-only for C/H). Release:
# GHCR identity verification + git tag + Kargo refresh (if wired).
#
# Concurrency: a superseded PR run is cancelled (the source controls are
# stateless). Release runs (push / dispatch) are NEVER cancelled: a
# half-tagged release or a re-pushed image tag must run to completion.

on:
  push:
    branches:
      - main
  # PR runs (reference parity): the Develop-phase controls run on the PR
  # merge ref and the pr-comment job posts the baseline-diffed findings on
  # the PR. The Build/Release jobs are guarded off on pull_request (a PR
  # must never build or tag the release image; no registry or tag side
  # effects).
  # C/H findings are graded and REPORTED (report-only policy) - they never
  # fail the check; a failed control or a missing/ungradeable report does.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  repository_dispatch:
    types: [trigger_release]
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to build (the app repo branch feeding the image)"
        required: true
        default: main
        type: string
      lib_ref:
        description: "devsecops-release-lib ref for the shared controls (branch/tag/commit)"
        required: false
        default: "main"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.target_branch || 'x' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  GHCR_REGISTRY: ghcr.io
  # The app's established image identity (the deploy overlays pin
  # ghcr.io/usfali-ke/frappe-gates-demo@sha256:... - the package lives in
  # the usfali-ke GHCR namespace, same as the repo's own ladder publishes).
  IMAGE_NAME: usfali-ke/frappe-gates-demo
  # DefDojo (product "frappe-gates-demo" - the same product the repo's
  # defectdojo-upload workflow uploads to; the DD_API_TOKEN secret is the
  # dojo admin token - the release-engine fallback for setup writes, same
  # pattern as hmis/afyangu/facility360):
  DD_URL: https://dojo.tiberbu.health/api/v2/import-scan/
  DD_PRODUCT_NAME: "frappe-gates-demo"
  DD_ENGAGEMENT_NAME: "frappe-gates-demo"
  # trivy pin for the image-scan job (same pin + sha256 as the shared
  # library's trivy - the lib's trivy-scan command is ECR-credentialed, so
  # this job installs the identical binary and scans the pulled image):
  TRIVY_VER: "0.76.0"
  TRIVY_SHA256: e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7

jobs:
  # GitVersion (tag prefix frappe-gates-demo-, GitVersion.yml in the repo
  # root - e.g. frappe-gates-demo-0.1.0 from main). Skipped on PR runs: the
  # version is consumed only by the release-side jobs, which are guarded off
  # there (and a PR merge-ref GitVersion run would report the head branch's
  # version, not the release branch's).
  version:
    uses: ./.github/workflows/version.yaml
    if: github.event_name != 'pull_request'
    with:
      app_name: frappe-gates-demo
    # Callable workflows do NOT inherit the caller's named secrets -
    # version.yaml's checkout uses token: ${{ secrets.GIT_TOKEN }} (the
    # top-level permissions: {} strips the inherited GITHUB_TOKEN scope),
    # so it must be passed explicitly or the checkout fails with
    # "Input required and not supplied: token".
    secrets:
      GIT_TOKEN: ${{ secrets.GIT_TOKEN }}

  # ── Develop + Build run IN PARALLEL (the Jenkins parallel[develop_controls,
  #    build_image] shape): the source controls scan the checkout, the build
  #    job builds the image itself (in-workflow buildx against the repo's own
  #    Dockerfile). ────────────────────────────────────────────────────────

  build:
    name: Build · docker buildx image (Frappe v15 bench app, amd64)
    runs-on: ubuntu-latest
    # PR runs never build the release image (the single identity is
    # release-branch-only).
    if: github.event_name != 'pull_request'
    needs: [version]
    timeout-minutes: 120
    # The identity of the release: the digest of the pushed image. The
    # release job re-verifies the tag still resolves to it before tagging
    # (a concurrent same-version re-push would change it - caught).
    outputs:
      digest: ${{ steps.identity.outputs.digest }}
    permissions:
      packages: write   # GHCR pull (private bench base) + push, via GITHUB_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GIT_TOKEN }}
          fetch-depth: 1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR (the app's package registry - GITHUB_TOKEN, packages scope)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Docker image (amd64 only - the app's established identity)
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 \
            -t "${GHCR_REGISTRY}/${IMAGE_NAME}:${{ needs.version.outputs.semVer }}" \
            --push .

      # ── The image identity (the reproducible-digest form): the DIGEST of
      #    the pushed image, read back from the registry, is the identity:
      #    recorded here, and the release job re-verifies the tag still
      #    resolves to it before tagging (a concurrent same-version re-push
      #    would change it - caught).
      - name: Record the image identity (digest from the registry - the identity the release re-verifies)
        id: identity
        run: |
          set -euo pipefail
          REPO="${IMAGE_NAME}"
          TAG="${{ needs.version.outputs.semVer }}"
          REF="${GHCR_REGISTRY}/${REPO}:${TAG}"
          J=$(docker buildx imagetools inspect "$REF") || {
            echo "::error::could not inspect $REF in the registry after the buildx push (fail-closed)"; exit 1; }
          DIGEST=$(jq -r '.Descriptor.digest // empty' <<<"$J")
          # manifest-list fallback: the RepoDigests entry carries the digest
          [ -n "$DIGEST" ] || DIGEST=$(jq -r '.RepoDigests[0] // empty' <<<"$J" | sed 's/^.*@//')
          { [ -n "$DIGEST" ] && [ "$DIGEST" != "null" ]; } || {
            echo "::error::image $REF not found in the registry after the buildx push (fail-closed)"; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          mkdir -p release
          # Evidence: identity.json, written via python (no heredoc - an
          # indented EOF delimiter is not recognized by bash inside a YAML
          # block scalar, and would silently swallow the rest of the step).
          IMAGE_DIGEST="$DIGEST" IMAGE_TAG="$TAG" \
          IMAGE_BRANCH="${GITHUB_REF_NAME}" \
          IMAGE_SHA="${GITHUB_SHA}" GHCR_REGISTRY="$GHCR_REGISTRY" IMAGE_NAME="$IMAGE_NAME" python3 -c '
          import json, os
          image = "%s/%s:%s" % (os.environ["GHCR_REGISTRY"], os.environ["IMAGE_NAME"], os.environ["IMAGE_TAG"])
          identity = {
              "image": image,
              "digest": os.environ["IMAGE_DIGEST"],
              "version": os.environ["IMAGE_TAG"],
              "branch": os.environ["IMAGE_BRANCH"],
              "source_commit": os.environ["IMAGE_SHA"],
          }
          json.dump(identity, open("release/identity.json", "w"), indent=2)
          '
          python3 -m json.tool release/identity.json >/dev/null
          cat release/identity.json
          echo "Identity recorded: ${REF} -> $DIGEST"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-identity
          path: release/
          if-no-files-found: ignore

  # ── Develop phase: the SOURCE controls, in parallel with the build (the
  #    Jenkins develop_controls branches). Each control keeps its report as a
  #    workflow artifact (evidence). ───────────────────────────────────────

  sast:
    name: Develop · SAST (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LIB: /tmp/devsecops-lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GIT_TOKEN }}
          fetch-depth: 1

      - name: Checkout shared library (devsecops-release-lib)
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          LIB_REF: ${{ inputs.lib_ref || 'main' }}
        run: |
          set -euo pipefail
          rm -rf "$LIB"
          git clone --depth 1 --branch "$LIB_REF" \
            "https://x-access-token:${GIT_TOKEN}@github.com/tiberbu/devsecops-release-lib.git" "$LIB"
          test -f "$LIB/resources/devsecops-gh.sh" || {
            echo "::error::devsecops-gh.sh not found at lib ref '$LIB_REF' - the shared library must be deployed; dispatch with lib_ref=<branch> or merge the lib PR first"
            exit 1; }

      - name: SAST scan (shared lib, pinned semgrep)
        run: bash "$LIB/resources/devsecops-gh.sh" semgrep-scan . sast/semgrep.json sast/semgrep.sarif

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-sast
          path: sast/
          if-no-files-found: ignore

  secrets:
    name: Develop · secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LIB: /tmp/devsecops-lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GIT_TOKEN }}
          fetch-depth: 0

      - name: Checkout shared library (devsecops-release-lib)
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          LIB_REF: ${{ inputs.lib_ref || 'main' }}
        run: |
          set -euo pipefail
          rm -rf "$LIB"
          git clone --depth 1 --branch "$LIB_REF" \
            "https://x-access-token:${GIT_TOKEN}@github.com/tiberbu/devsecops-release-lib.git" "$LIB"
          test -f "$LIB/resources/devsecops-gh.sh" || {
            echo "::error::devsecops-gh.sh not found at lib ref '$LIB_REF' - the shared library must be deployed; dispatch with lib_ref=<branch> or merge the lib PR first"
            exit 1; }

      - name: gitleaks full-history scan (shared lib, pinned gitleaks)
        run: bash "$LIB/resources/devsecops-gh.sh" gitleaks-scan . secrets/gitleaks.json secrets/gitleaks.sarif

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-secrets
          path: secrets/
          if-no-files-found: ignore

  # ── trufflehog (reference parity: the second secrets tool). Working-tree
  #    source (gitleaks already covers the full git history), verification
  #    ON by default. The lib strips Raw before the reports are stored and
  #    generates the SARIF. Wrapper exit contract: 0 = scan complete
  #    (findings, if any, are recorded in the reports), non-zero = scan
  #    crash (fail-closed).
  secrets-th:
    name: Develop · secrets (trufflehog, verified, working tree)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LIB: /tmp/devsecops-lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GIT_TOKEN }}
          fetch-depth: 1

      - name: Checkout shared library (devsecops-release-lib)
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          LIB_REF: ${{ inputs.lib_ref || 'main' }}
        run: |
          set -euo pipefail
          rm -rf "$LIB"
          git clone --depth 1 --branch "$LIB_REF" \
            "https://x-access-token:${GIT_TOKEN}@github.com/tiberbu/devsecops-release-lib.git" "$LIB"
          test -f "$LIB/resources/devsecops-gh.sh" || {
            echo "::error::devsecops-gh.sh not found at lib ref '$LIB_REF' - the shared library must be deployed; dispatch with lib_ref=<branch> or merge the lib PR first"
            exit 1; }

      - name: trufflehog secrets scan (shared lib, pinned trufflehog, verified results, Raw stripped)
        run: bash "$LIB/resources/devsecops-gh.sh" trufflehog-scan . secrets-th/thufflehog.json secrets-th/trufflehog.sarif

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-secrets-th
          path: secrets-th/
          if-no-files-found: ignore

  # ── Quality: ruff on the repo's own config (pyproject [tool.ruff]). The
  #    shared lib's ruff-scan runs the pinned ruff with the repo config and
  #    writes JSON + SARIF; the lib's wrapper exit contract is "0 = scan
  #    complete, non-zero = scan crash" - so the job fails on a ruff that
  #    CANNOT run (fail-closed control health), and the findings themselves
  #    are graded by the findings gate (F/B -> HIGH, E/W -> MEDIUM,
  #    I/UP/RUF -> LOW; REPORT-ONLY - the policy for this app, like every
  #    other tool in this pipeline).
  quality:
    name: Develop · quality (ruff, repo config)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIB: /tmp/devsecops-lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GIT_TOKEN }}
          fetch-depth: 1

      - name: Checkout shared library (devsecops-release-lib)
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          LIB_REF: ${{ inputs.lib_ref || 'main' }}
        run: |
          set -euo pipefail
          rm -rf "$LIB"
          git clone --depth 1 --branch "$LIB_REF" \
            "https://x-access-token:${GIT_TOKEN}@github.com/tiberbu/devsecops-release-lib.git" "$LIB"
          test -f "$LIB/resources/devsecops-gh.sh" || {
            echo "::error::devsecops-gh.sh not found at lib ref '$LIB_REF' - the shared library must be deployed; dispatch with lib_ref=<branch> or merge the lib PR first"
            exit 1; }

      - name: ruff lint (shared lib, pinned ruff, repo pyproject config; JSON + SARIF evidence)
        run: bash "$LIB/resources/devsecops-gh.sh" ruff-scan . quality/ruff.json quality/ruff.sarif

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-quality
          path: quality/
          if-no-files-found: ignore

  # ── Hermes AI security review (hmis-style, single-delivery PULL mode):
  #    the repo-local hermes_review.py (checked out at the trusted base SHA)
  #    fetches the PR diff via `gh pr diff`, HMAC-signs the event payload,
  #    sends ONE webhook to the gateway, then polls for the PR comment.
  #    Findings are advisory — only a technical failure (NOT COMPLETED /
  #    timeout) fails the job. Runs on every pull request like the other
  #    Develop controls (there is no push-mode variant: no PR, no review).
  ai-security:
    name: Develop · AI security review (Hermes, PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    env:
      OUT: reports/ai-review
      VERDICT_FILE: reports/ai-review/verdict.json
    steps:
      - name: Checkout trusted review tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify Hermes configuration
        env:
          HERMES_URL: ${{ vars.HERMES_WEBHOOK_URL }}
          HERMES_SECRET: ${{ secrets.HERMES_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          [ -n "$HERMES_URL" ] || { echo "::error::HERMES_WEBHOOK_URL not configured"; exit 1; }
          [ -n "$HERMES_SECRET" ] || { echo "::error::HERMES_WEBHOOK_SECRET not configured"; exit 1; }
          python3 --version
          gh --version
          test -f .github/scripts/hermes_review.py

      - name: Run Hermes AI Security Review
        id: verdict
        env:
          HERMES_URL: ${{ vars.HERMES_WEBHOOK_URL }}
          HERMES_SECRET: ${{ secrets.HERMES_WEBHOOK_SECRET }}
          HERMES_COMMENTER: ${{ vars.HERMES_COMMENTER }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          WAIT_SECONDS: "1500"
          MAX_DIFF_BYTES: "450000"
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 .github/scripts/hermes_review.py

      - name: Upload AI Review Report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-ai-review
          path: reports/ai-review/
          if-no-files-found: ignore

  # ── IaC: checkov on the repo's own Dockerfile (the Dockerfile is in the
  #    checkout, so this control runs on PR runs too, and the report is a
  #    PR-required report).
  iac:
    name: Develop · IaC (checkov Dockerfile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIB: /tmp/devsecops-lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GIT_TOKEN }}
          fetch-depth: 1

      - name: Checkout shared library (devsecops-release-lib)
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          LIB_REF: ${{ inputs.lib_ref || 'main' }}
        run: |
          set -euo pipefail
          rm -rf "$LIB"
          git clone --depth 1 --branch "$LIB_REF" \
            "https://x-access-token:${GIT_TOKEN}@github.com/tiberbu/devsecops-release-lib.git" "$LIB"
          test -f "$LIB/resources/devsecops-gh.sh" || {
            echo "::error::devsecops-gh.sh not found at lib ref '$LIB_REF' - the shared library must be deployed; dispatch with lib_ref=<branch> or merge the lib PR first"
            exit 1; }

      - name: checkov Dockerfile scan (shared lib, pinned checkov, dockerfile framework)
        run: bash "$LIB/resources/devsecops-gh.sh" checkov-scan Dockerfile iac/checkov.json iac/checkov.sarif

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-iac
          path: iac/
          if-no-files-found: ignore

  # ── SCA (reference parity): trivy fs on the dependency manifests -
  #    requirements.txt + pyproject.toml (trivy's pip/python detection), dev
  #    deps included.
  sca:
    name: Develop · SCA (trivy fs, dependency manifests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIB: /tmp/devsecops-lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GIT_TOKEN }}
          fetch-depth: 1

      - name: Checkout shared library (devsecops-release-lib)
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          LIB_REF: ${{ inputs.lib_ref || 'main' }}
        run: |
          set -euo pipefail
          rm -rf "$LIB"
          git clone --depth 1 --branch "$LIB_REF" \
            "https://x-access-token:${GIT_TOKEN}@github.com/tiberbu/devsecops-release-lib.git" "$LIB"
          test -f "$LIB/resources/devsecops-gh.sh" || {
            echo "::error::devsecops-gh.sh not found at lib ref '$LIB_REF' - the shared library must be deployed; dispatch with lib_ref=<branch> or merge the lib PR first"
            exit 1; }

      - name: trivy fs manifest SCA (shared lib, pinned trivy, HIGH/CRITICAL, dev deps)
        run: bash "$LIB/resources/devsecops-gh.sh" trivy-fs-scan . sca/trivy-fs.sarif

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-sca
          path: sca/
          if-no-files-found: ignore

  # ── Unit tests: the app's bench suite (the Frappe test runner against a
  #    real MariaDB + Redis - the same setup the repo's own ladder uses;
  #    the framework pinned to the tag the product apps run, v15). ENABLED
  #    in this app (the suite is green on main) - the junit report is a
  #    required gate report; a red suite blocks the tag (fail-closed).
  unit-tests:
    name: Develop · unit tests (Frappe bench suite, real MariaDB)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      FRAPPE_BRANCH: v15.123.1
      BENCH_DIR: ${{ github.workspace }}/../frappe-bench
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_ROOT_PASSWORD: root
      ADMIN_PASSWORD: admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GIT_TOKEN }}
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "18"

      - name: Run the bench test suite (junit evidence)
        run: |
          set -uo pipefail
          mkdir -p unit-tests
          rc=0
          python -m pip install --quiet "frappe-bench==5.31.0" "unittest-xml-reporting~=3.2" || rc=$?
          # bench resolves its bench directory from the working directory.
          b() { ( cd "$BENCH_DIR" && bench "$@" ); }
          # bench init CREATES $BENCH_DIR, so it runs from the workspace.
          [ "$rc" != 0 ] || ( cd "$GITHUB_WORKSPACE" && bench init --frappe-branch "$FRAPPE_BRANCH" \
            --skip-redis-config-generation --skip-assets --python python3.11 "$BENCH_DIR" ) || rc=$?
          [ "$rc" != 0 ] || b get-app "$GITHUB_WORKSPACE" || rc=$?
          [ "$rc" != 0 ] || b new-site test_site \
            --db-host "$DB_HOST" --db-port "$DB_PORT" \
            --mariadb-root-username root --mariadb-root-password "$DB_ROOT_PASSWORD" \
            --admin-password "$ADMIN_PASSWORD" --no-mariadb-socket || rc=$?
          [ "$rc" != 0 ] || b --site test_site install-app frappe_gates_demo || rc=$?
          # The test runner needs a cache/queue and `allow_tests` on the site.
          [ "$rc" != 0 ] || b set-config -g redis_cache redis://127.0.0.1:6379/0 || rc=$?
          [ "$rc" != 0 ] || b set-config -g redis_queue redis://127.0.0.1:6379/1 || rc=$?
          [ "$rc" != 0 ] || b set-config -g redis_socketio redis://127.0.0.1:6379/2 || rc=$?
          [ "$rc" != 0 ] || b set-config -g allow_tests 1 || rc=$?
          [ "$rc" != 0 ] || b setup requirements --dev || rc=$?
          # From sites/ (that is where bench executes frappe commands).
          [ "$rc" != 0 ] || ( cd "$BENCH_DIR/sites" && ../env/bin/python -m frappe.utils.bench_helper frappe \
            --site test_site run-tests --app frappe_gates_demo \
            --junit-xml-output "$GITHUB_WORKSPACE/unit-tests/junit.xml" ) || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::bench test suite failed (rc=$rc) - the junit report is preserved as the control's evidence"
            exit "$rc"
          fi
          echo "bench test suite: all green (junit in unit-tests/junit.xml)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-unit-tests
          path: unit-tests/
          if-no-files-found: ignore

  # ── Build phase, part 2: the IMAGE controls that run in PARALLEL against
  #    the built image (one parallel job per control - the Jenkins imageScan
  #    branches). Each job reads the version from the shared version job
  #    (GitVersion is deterministic for the run's commit + tag set). ──────

  cosign:
    name: Build · cosign sign (shared release key -> GHCR)
    runs-on: ubuntu-latest
    # The COSIGN_KEY secret is the shared release key (the same
    # cosign-release-key the other apps sign with - one key, one verifier;
    # the Jenkins gha-verify re-check verifies it).
    if: github.event_name != 'pull_request'
    needs: [version, build]
    timeout-minutes: 30
    permissions:
      packages: write   # push the signature to the registry
    env:
      LIB: /tmp/devsecops-lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GIT_TOKEN }}
          fetch-depth: 1

      - name: Checkout shared library (devsecops-release-lib)
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          LIB_REF: ${{ inputs.lib_ref || 'main' }}
        run: |
          set -euo pipefail
          rm -rf "$LIB"
          git clone --depth 1 --branch "$LIB_REF" \
            "https://x-access-token:${GIT_TOKEN}@github.com/tiberbu/devsecops-release-lib.git" "$LIB"
          test -f "$LIB/resources/devsecops-gh.sh" || exit 1

      - name: Login to GHCR (registry auth for the signature push)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: cosign sign (shared lib, registry-agnostic)
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
        run: bash "$LIB/resources/devsecops-gh.sh" cosign-sign "$GHCR_REGISTRY" "$IMAGE_NAME" "${{ needs.version.outputs.semVer }}"

  image-scan:
    name: Build · image scan (trivy)
    runs-on: ubuntu-latest
    # Release-only: a PR run builds no image (no registry or tag side
    # effects on a PR), so there is nothing to scan - the image scan is a
    # Build-phase control. On PR runs the DefDojo import skips the absent
    # image-scan report per-file (it publishes whatever reports landed).
    if: github.event_name != 'pull_request'
    needs: [version, build]
    timeout-minutes: 60
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GIT_TOKEN }}
          fetch-depth: 1

      - name: Login to GHCR (pull the built image)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The shared lib's trivy-scan command is ECR-credentialed (aws ecr
      # get-login-password); for GHCR this job installs the SAME pinned
      # trivy (same release + sha256 as the lib) and scans the pulled image
      # locally - identical binary, identical flags, registry-agnostic.
      - name: Install trivy (same pin + sha256 as the shared library)
        run: |
          set -euo pipefail
          curl -sfL -o /tmp/trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VER}/trivy_${TRIVY_VER}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tgz" | sha256sum -c -
          mkdir -p /tmp/trivy-bin
          tar xzf /tmp/trivy.tgz -C /tmp/trivy-bin trivy

      - name: Pull the built image and scan it (HIGH/CRITICAL, SARIF)
        run: |
          set -euo pipefail
          TAG="${{ needs.version.outputs.semVer }}"
          docker pull "${GHCR_REGISTRY}/${IMAGE_NAME}:${TAG}"
          mkdir -p image-scan
          /tmp/trivy-bin/trivy image --severity HIGH,CRITICAL \
            --format sarif --output image-scan/trivy.sarif \
            "${GHCR_REGISTRY}/${IMAGE_NAME}:${TAG}"
          [ -s image-scan/trivy.sarif ] || { echo "trivy produced no SARIF report (fail-closed)"; exit 1; }

      # Evidence: the control's report as an artifact (the reference shape).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-image-scan
          path: image-scan/
          if-no-files-found: ignore

  dockle:
    name: Build · CIS benchmark (dockle)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: [version, build]
    timeout-minutes: 60
    permissions:
      packages: read
    env:
      LIB: /tmp/devsecops-lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GIT_TOKEN }}
          fetch-depth: 1

      - name: Checkout shared library (devsecops-release-lib)
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          LIB_REF: ${{ inputs.lib_ref || 'main' }}
        run: |
          set -euo pipefail
          rm -rf "$LIB"
          git clone --depth 1 --branch "$LIB_REF" \
            "https://x-access-token:${GIT_TOKEN}@github.com/tiberbu/devsecops-release-lib.git" "$LIB"
          test -f "$LIB/resources/devsecops-gh.sh" || {
            echo "::error::devsecops-gh.sh not found at lib ref '$LIB_REF' - the shared library must be deployed; dispatch with lib_ref=<branch> or merge the lib PR first"
            exit 1; }

      - name: Login to GHCR (registry pull for the CIS scan)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: dockle CIS scan (shared lib, pinned dockle; scanned, not dojo-published - Jenkins parity)
        run: bash "$LIB/resources/devsecops-gh.sh" dockle-scan "$GHCR_REGISTRY" "$IMAGE_NAME" "${{ needs.version.outputs.semVer }}" dockle/dockle.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-dockle
          path: dockle/
          if-no-files-found: ignore

  sbom:
    name: Build · SBOM (syft cyclonedx)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: [version, build]
    timeout-minutes: 60
    permissions:
      packages: read
    env:
      LIB: /tmp/devsecops-lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GIT_TOKEN }}
          fetch-depth: 1

      - name: Checkout shared library (devsecops-release-lib)
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          LIB_REF: ${{ inputs.lib_ref || 'main' }}
        run: |
          set -euo pipefail
          rm -rf "$LIB"
          git clone --depth 1 --branch "$LIB_REF" \
            "https://x-access-token:${GIT_TOKEN}@github.com/tiberbu/devsecops-release-lib.git" "$LIB"
          test -f "$LIB/resources/devsecops-gh.sh" || {
            echo "::error::devsecops-gh.sh not found at lib ref '$LIB_REF' - the shared library must be deployed; dispatch with lib_ref=<branch> or merge the lib PR first"
            exit 1; }

      - name: Login to GHCR (registry source for the SBOM)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: syft SBOM (shared lib, pinned syft; scanned, not dojo-published - Jenkins parity)
        run: bash "$LIB/resources/devsecops-gh.sh" syft-scan "$GHCR_REGISTRY" "$IMAGE_NAME" "${{ needs.version.outputs.semVer }}" sbom/sbom.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-sbom
          path: sbom/
          if-no-files-found: ignore

  # ── G2 control gate (Build → Release): the reference's gate shape, as its
  #    own job. Two fail-closed layers: (1) every required control's result
  #    must have succeeded, and (2) the findings gate (gate_findings.py)
  #    grades the control reports - REPORT-ONLY for CRITICAL/HIGH findings
  #    (facility360 policy 2026-10-29, the hmis 2026-10-28 policy - the
  #    same policy this app adopts): findings are graded + listed but never
  #    block; a missing/ungradeable required report also blocks the release
  #    (no tag - never an implicit pass). PR runs have no gate: their Build
  #    jobs are guarded off and their feedback + enforced gate is the
  #    pr-comment job.
  gate-g2:
    name: G2 control gate (Build → Release, fail-closed)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    # cosign IS in the needs (the signed image is a release control - a
    # failing signature blocks the tag). unit-tests IS in the needs (the
    # bench suite is a gate control in this app - enabled, green on main).
    needs: [version, build, cosign, image-scan, sast, secrets, secrets-th, quality, iac, sca, unit-tests, dockle, sbom]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GIT_TOKEN }}
          fetch-depth: 1

      # The findings gate input (the control reports, merged flat - the
      # artifact zips keep their files at the zip root). continue-on-error:
      # a download hiccup must surface as the gate's own fail-closed "missing
      # report" verdict, not as a crash the gate cannot read.
      - name: Download the control reports (findings gate input)
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: report-*
          merge-multiple: true
          path: reports

      - name: Gate verdict (every required control succeeded?)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          not_ready=$(jq -r 'to_entries | map(select(.value.result != "success") | .key) | join(", ")' <<<"$NEEDS")
          if [ -n "$not_ready" ]; then
            echo "::error::G2 gate FAILED - required control(s) not successful: $not_ready - NO tag (fail-closed)"
            exit 1
          fi
          echo "G2 gate: all required controls succeeded"

      # The junit report (the bench suite evidence) is parsed with defusedxml
      # (XXE-safe, per semgrep use-defused-xml-parse) - the GHA runner's
      # python3 does not ship it.
      - name: Ensure defusedxml (gate_findings.py JUnit parsing - XXE-safe)
        if: always()
        run: python3 -m pip install --quiet defusedxml

      # Findings gate (report-only for findings - the app's policy, per the
      # facility360/hmis precedent): grades the control reports and LISTs
      # CRITICAL/HIGH findings (the same gate_findings.py the PR check
      # grades with - one canonical implementation); findings never block.
      # Fail-closed: a required report that did not land (or cannot be
      # parsed) blocks, it is never a silent pass.
      - name: Findings gate (grade the reports, report-only for C/H, fail-closed on missing reports)
        run: |
          set -euo pipefail
          python3 .github/scripts/gate_findings.py \
            --reports-dir reports \
            --required semgrep.json \
            --required gitleaks.json \
            --required thufflehog.json \
            --required ruff.json \
            --required checkov.sarif \
            --required trivy-fs.sarif \
            --required trivy.sarif \
            --required junit.xml \
            --findings-md reports/findings.md

      - name: Gate summary
        run: |
          set -euo pipefail
          {
            echo "## G2 control gate: PASS"
            echo ""
            echo "Every required control succeeded: develop (semgrep, gitleaks, trufflehog, ruff, trivy fs, checkov, bench unit tests) + build (buildx, cosign, trivy, dockle, syft). Findings gate: REPORT-ONLY for CRITICAL/HIGH findings (facility360-style policy - they are graded and listed, never block); a missing/ungradeable report still blocks (fail-closed). DefDojo import runs as a reporting sink (not a gate control)."
            echo ""
            echo "The release job may tag (image identity re-verified in the registry first)."
          } >> $GITHUB_STEP_SUMMARY

      # Full findings detail: every individual finding from the graded
      # reports (written by the gate step to reports/findings.md) - counts
      # alone are not enough to act on.
      - name: Append the full findings list to the summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo ""
            echo "## Findings detail (every finding from the graded reports)"
            if [ -s reports/findings.md ]; then
              cat reports/findings.md
            else
              echo "_no findings in the graded reports_"
            fi
          } >> $GITHUB_STEP_SUMMARY

  # ── Release: the handoff. Runs only when the G2 gate passed; re-verifies
  #    the image identity in the registry at the build's recorded digest
  #    (the tag can never point at an image that doesn't exist - or at
  #    bytes a concurrent run swapped into the tag), then tags, then
  #    triggers the Kargo warehouse refresh (wired only when the secret is
  #    set - a no-op for this app today).
  release:
    name: Release · tag (image identity verified in the registry)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    # gate-g2 = the fail-closed verdict over every control; build = the
    # recorded digest (the identity the tag must still resolve to).
    needs: [gate-g2, build, version]
    timeout-minutes: 15
    permissions:
      packages: read
    env:
      LIB: /tmp/devsecops-lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GIT_TOKEN }}
          fetch-depth: 0

      - name: Checkout shared library (devsecops-release-lib)
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          LIB_REF: ${{ inputs.lib_ref || 'main' }}
        run: |
          set -euo pipefail
          rm -rf "$LIB"
          git clone --depth 1 --branch "$LIB_REF" \
            "https://x-access-token:${GIT_TOKEN}@github.com/tiberbu/devsecops-release-lib.git" "$LIB"
          test -f "$LIB/resources/devsecops-gh.sh" || {
            echo "::error::devsecops-gh.sh not found at lib ref '$LIB_REF' - the shared library must be deployed; dispatch with lib_ref=<branch> or merge the lib PR first"
            exit 1; }

      - name: Login to GHCR (registry access for the identity re-check)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify the image identity in the registry (present + digest unchanged since the build - before tagging)
        run: |
          set -euo pipefail
          REPO="${IMAGE_NAME}"
          TAG="${{ needs.version.outputs.semVer }}"
          REF="${GHCR_REGISTRY}/${REPO}:${TAG}"
          J=$(docker buildx imagetools inspect "$REF" 2>/dev/null) || {
            echo "::error::image not found in the registry: $REF - NO tag (fail-closed)"
            exit 1; }
          DIGEST=$(jq -r '.Descriptor.digest // empty' <<<"$J")
          [ -n "$DIGEST" ] || DIGEST=$(jq -r '.RepoDigests[0] // empty' <<<"$J" | sed 's/^.*@//')
          { [ -n "$DIGEST" ] && [ "$DIGEST" != "null" ]; } || {
            echo "::error::no image digest for $REF - NO tag (fail-closed)"
            exit 1; }
          EXPECTED="${{ needs.build.outputs.digest }}"
          if [ -n "$EXPECTED" ] && [ "$DIGEST" != "$EXPECTED" ]; then
            echo "::error::digest mismatch: the build recorded ${EXPECTED} but ${REF} now resolves to ${DIGEST} - the tag was re-pushed after the build (a concurrent same-version run) - NO tag (fail-closed)"
            exit 1
          fi
          # NOTE: no apostrophes / ${VAR:+...} in this echo - bash mis-parses a
          # single quote inside a ${VAR:+word} expansion and the step dies with
          # "unexpected EOF while looking for matching quote" (hmis run 40630129195).
          if [ -n "$EXPECTED" ]; then
            echo "verified in the registry: $REF (digest $DIGEST - matches the build-recorded identity)"
          else
            echo "verified in the registry: $REF (digest $DIGEST)"
          fi

      - name: Create and push git tag (shared lib; only after the G2 gate + the identity verification)
        run: bash "$LIB/resources/devsecops-gh.sh" git-tag "${{ needs.version.outputs.tagName }}"

      - name: Trigger Kargo Warehouse Refresh (wired only when the secret is set - a no-op today)
        env:
          KARGO_WEBHOOK_URL: ${{ secrets.KARGO_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          { [ -n "${KARGO_WEBHOOK_URL:-}" ] || { echo "KARGO_WEBHOOK_URL not set - skipping the refresh"; exit 0; }; }
          curl -fsS -X POST \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$KARGO_WEBHOOK_URL"
          echo "Kargo warehouse refresh triggered"

      - name: Release summary
        env:
          LIB_REF: ${{ inputs.lib_ref || 'main' }}
        run: |
          {
            echo "## main release ${{ needs.version.outputs.semVer }}"
            echo ""
            echo "- **Registry:** GHCR (\`${{ env.GHCR_REGISTRY }}\`) - the app's established identity (the deploy overlays pin it)"
            echo "- **Image:** \`${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.version.outputs.semVer }}\`"
            echo "- **Identity:** digest \`${{ needs.build.outputs.digest }}\` (recorded at build; the tag re-verified against this digest before tagging)"
            echo "- **Build:** in-workflow docker buildx (the repo's own Dockerfile, Frappe v15 bench app, amd64 only)"
            echo "- **Version flow:** GitVersion (the repo's GitVersion.yml - tag prefix \`${{ needs.version.outputs.tagName }}\`); the image verified in the registry before the tag"
            echo "- **Shared library:** devsecops-release-lib @ $LIB_REF"
            echo "- **Develop controls (parallel with the build):** semgrep, gitleaks (full history), trufflehog (verified), ruff (repo config), trivy fs (manifest SCA), checkov (Dockerfile), bench unit tests (real MariaDB)"
            echo "- **Build controls (parallel):** cosign (shared release key), trivy, dockle (CIS), syft (SBOM)"
            echo "- **G2 control gate:** PASS (every required control re-checked fail-closed before this release job ran; C/H findings report-only)"
            echo "- **Git tag:** \`${{ needs.version.outputs.tagName }}\` (pushed only after registry verification)"
            echo "- **Kargo:** warehouse refresh (triggered only when KARGO_WEBHOOK_URL is set)"
            echo "- **Source commit:** \`${{ github.sha }}\`"
          } >> $GITHUB_STEP_SUMMARY

  # ── DefDojo: the reporting push as its OWN job (the reference shape).
  #    Target: product "frappe-gates-demo" (the same product the repo's own
  #    defectdojo-upload workflow uses; the engagement is resolved/created
  #    by name). The DD_API_TOKEN secret is the dojo admin token (the
  #    release-engine fallback for setup writes - the dojo-import lib
  #    resolves the product/engagement by name). Runs on PR runs too: the
  #    Develop-phase reports are imported per PR run (the dojo model this
  #    repo's own defectdojo-upload workflow used). It publishes whichever
  #    reports landed - on release runs it waits for the image scan (in the
  #    needs) and imports it; on PR runs no image is built (the image-scan
  #    job is skipped) and dojo-import skips the absent report per-file.
  #    DefDojo is a reporting sink, not a release control - it is NOT in
  #    the gate needs, by design.
  defdojo:
    name: DefDojo · import all control reports (frappe-gates-demo)
    runs-on: ubuntu-latest
    # image-scan stays in the needs so RELEASE runs wait for the image scan
    # (no artifact race); on PR runs the image-scan job is skipped (no image
    # is built on a PR) and the explicit if overrides the needs gate, so
    # defdojo publishes the Develop-phase reports anyway - the dojo-import
    # skips the absent image-scan report per-file.
    needs: [sast, secrets, secrets-th, quality, iac, sca, image-scan]
    if: >-
      github.event_name == 'pull_request' ||
      success()
    timeout-minutes: 15
    env:
      LIB: /tmp/devsecops-lib
    steps:
      - name: Checkout shared library (devsecops-release-lib)
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          LIB_REF: ${{ inputs.lib_ref || 'main' }}
        run: |
          set -euo pipefail
          rm -rf "$LIB"
          git clone --depth 1 --branch "$LIB_REF" \
            "https://x-access-token:${GIT_TOKEN}@github.com/tiberbu/devsecops-release-lib.git" "$LIB"
          test -f "$LIB/resources/devsecops-gh.sh" || exit 1

      # One download per report artifact into its OWN folder (NOT
      # merge-multiple: the artifact zips keep the files at the zip root -
      # a single merged download would flatten them and the dojo-import
      # paths would not resolve). continue-on-error: a missing artifact
      # (a crashed control) is skipped by dojo-import, it must not fail the
      # job.
      - name: Download report-sast -> sast/
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: report-sast, path: sast }
      - name: Download report-secrets -> secrets/
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: report-secrets, path: secrets }
      - name: Download report-secrets-th -> secrets-th/
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: report-secrets-th, path: secrets-th }
      - name: Download report-quality -> quality/
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: report-quality, path: quality }
      - name: Download report-iac -> iac/
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: report-iac, path: iac }
      - name: Download report-sca -> sca/
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: report-sca, path: sca }
      - name: Download report-image-scan -> image-scan/
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: report-image-scan, path: image-scan }

      - name: Push all control reports to DefDojo (one reimport-scan per report)
        continue-on-error: true
        env:
          DD_API_TOKEN: ${{ secrets.DD_API_TOKEN }}
        run: |
          set -euo pipefail
          # dojo-import skips missing reports and is fail-closed on a missing
          # product; the continue-on-error above keeps the run green either
          # way (DefDojo is a reporting sink, not a release control).
          bash "$LIB/resources/devsecops-gh.sh" dojo-import \
            sast/semgrep.sarif \
            secrets/gitleaks.sarif \
            secrets-th/trufflehog.sarif \
            quality/ruff.sarif \
            iac/checkov.sarif \
            sca/trivy-fs.sarif \
            image-scan/trivy.sarif

      - name: DefDojo summary (findings per control -> the run summary)
        if: always()
        run: |
          set -uo pipefail
          count() { jq -r '[.runs[]?.results[]?] | length' "$1" 2>/dev/null || echo "?"; }
          {
            echo "## DefDojo import summary"
            echo ""
            echo "Target: **${DD_PRODUCT_NAME} / ${DD_ENGAGEMENT_NAME}** - one reimport-scan per control report, deduped across releases."
            echo ""
            echo "Best-effort by design: a missing Dojo engagement or a Dojo outage does not fail the release run (check the job log for the import result)."
            echo ""
            echo "| Control | Findings | Report |"
            echo "|---|---|---|"
            for pair in \
              "SAST (semgrep):sast/semgrep.sarif" \
              "Secrets (gitleaks, full history):secrets/gitleaks.sarif" \
              "Secrets (trufflehog, verified):secrets-th/trufflehog.sarif" \
              "Quality (ruff):quality/ruff.sarif" \
              "IaC (checkov):iac/checkov.sarif" \
              "SCA (trivy fs, dependency manifests):sca/trivy-fs.sarif" \
              "Image scan (trivy):image-scan/trivy.sarif"; do
              label="${pair%%:*}"
              path="${pair#*:}"
              if [ ! -s "$path" ]; then
                printf '| %s | - | no report |\n' "$label"
              else
                printf '| %s | %s | %s |\n' "$label" "$(count "$path")" "$(basename "$path")"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # ── PR feedback + enforced PR gate (reference parity: the findings
  #    comment + the gate verdict). PR runs only: collects this run's
  #    develop-phase report artifacts, counts findings per control, diffs
  #    them against the baseline (the latest SUCCESSFUL release run on
  #    main, fetched via the GitHub API), evaluates the gate verdict on the
  #    develop controls (the same fail-closed logic the G2 gate runs on
  #    release runs), and posts/updates one marker-anchored comment on the
  #    PR (no spam - one comment, updated in place on every re-push). Runs
  #    even when a control failed (the comment shows the failure) - the
  #    feedback loop is the point of the job. The gate is then ENFORCED
  #    (REPORT-ONLY for findings): after the comment is posted, the same
  #    gate_findings.py the G2 gate grades with decides the exit code -
  #    CRITICAL/HIGH findings are REPORTED (never fail the check); a
  #    missing/ungradeable required report, or a graded control that did
  #    not succeed -> the run FAILS (red PR check), so control health is
  #    never skipped on PRs.
  pr-comment:
    name: PR · findings comment (baseline-diffed feedback)
    runs-on: ubuntu-latest
    # PR runs only; always() so the comment still posts (with failures
    # marked) when a needed control did not succeed. Hermes (`ai-security`)
    # is a need like the other security controls: the comment waits for it
    # and renders its state (its C/H findings stay advisory - only a
    # control failure, e.g. NOT COMPLETED, surfaces as failed). The
    # image-scan control is release-only (no image is built on a PR), so it
    # is NOT a need and its row renders only when a report is present.
    if: always() && github.event_name == 'pull_request'
    needs: [sast, secrets, secrets-th, quality, iac, sca, unit-tests, ai-security]
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GIT_TOKEN }}
          fetch-depth: 1

      - name: Download this run's report artifacts
        if: always()
        continue-on-error: true  # a fully-crashed run has no artifacts - the comment still posts ("no report" per control)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: report-*
          merge-multiple: true
          path: reports

      - name: Ensure defusedxml (pr_findings.py JUnit parsing - XXE-safe, per semgrep use-defused-xml-parse)
        if: always()
        run: python3 -m pip install --quiet defusedxml

      - name: Post the findings comment + enforce the findings gate (repo script, baseline-diffed, C/H reported)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || 'main' }}
          GATE_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/pr_findings.py
