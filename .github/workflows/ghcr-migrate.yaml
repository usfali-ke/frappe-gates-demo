name: ghcr-migrate

# Copy the app's GHCR repositories from ghcr.io/usfali-ke to ghcr.io/tiberbu
# (2026-11-09). The repo moved to the tiberbu org; its workflow token can't
# write to the usfali-ke namespace, so every push failed with "The requested
# installation does not exist" and the pipelines now publish to ghcr.io/tiberbu.
#
# What is already pinned has to exist there first, at the SAME digest: the
# bench base image (Dockerfile), the mirrored MariaDB / Redis
# (deploy/base/dependencies.yaml) and the digests dev / staging / prod run
# (deploy/*/kustomization.yaml). `crane copy` copies manifests and blobs
# byte for byte, so digests don't change and no pin needs editing. Every tag
# is copied, cosign signatures and attestations (sha256-<digest>.sig/.att)
# included.
#
# Idempotent: a tag already present with the same digest is skipped. Runs on
# the PR that introduces it (a same-repo PR's token can write packages) and by
# hand. Delete this workflow once the old packages are retired.

on:
  pull_request:
    paths: [".github/workflows/ghcr-migrate.yaml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ghcr-migrate
  cancel-in-progress: false

jobs:
  copy:
    name: Copy usfali-ke → tiberbu (every tag, digests unchanged)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    permissions:
      packages: write
    env:
      CRANE_VER: "0.22.1"
      CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
      SRC: ghcr.io/usfali-ke
      DST: ghcr.io/tiberbu
      REPOS: frappe-gates-demo-bench frappe-gates-demo
      # Must resolve in DST afterwards (repo@digest) - the pins in this repo.
      PINNED: >-
        frappe-gates-demo-bench@sha256:eda3717eabb2dbd934a8d27996e0937810468e3e0c632d74d0a6660b6161e33f
        frappe-gates-demo@sha256:bb27bde261794d326398a9c998ddf9f35db45296d829123bff829cd076f68107
        frappe-gates-demo@sha256:8be847644e195abc4c10c8d9936cfa45332eccc6b714fa7b186ff43f1f4d5579
        frappe-gates-demo@sha256:d88e34ff5641481972642065229bdcf0253143ecaa3c4784ed2c3e17bd44caf4
        frappe-gates-demo@sha256:72288e24c054855fbb6da2fe41332a6ec6f6b740365203b614130b70e67b31e7
    steps:
      - name: Install crane (pinned, checksum-verified)
        run: |
          set -euo pipefail
          curl -sfL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/gcr.tgz" \
            "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VER}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  $RUNNER_TEMP/gcr.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/gcr.tgz" -C "$RUNNER_TEMP" crane
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Log in to GHCR (the run's own token)
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | crane auth login ghcr.io -u "$ACTOR" --password-stdin

      - name: Copy every tag
        run: |
          set -euo pipefail
          copied=0 skipped=0
          for repo in $REPOS; do
            tags=$(crane ls "$SRC/$repo")
            for tag in $tags; do
              want=$(crane digest "$SRC/$repo:$tag")
              have=$(crane digest "$DST/$repo:$tag" 2>/dev/null || true)
              if [ "$have" = "$want" ]; then skipped=$((skipped + 1)); continue; fi
              crane copy "$SRC/$repo:$tag" "$DST/$repo:$tag"
              copied=$((copied + 1))
            done
          done
          echo "copied $copied tag(s), $skipped already present"
          echo "Copied **$copied** tag(s) from \`$SRC\` to \`$DST\`; **$skipped** were already there." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify every pinned digest resolves in the new namespace
        run: |
          set -euo pipefail
          missing=0
          for ref in $PINNED; do
            if crane manifest "$DST/$ref" >/dev/null 2>&1; then
              echo "ok      $DST/$ref"
            else
              echo "::error::missing $DST/$ref"; missing=$((missing + 1))
            fi
          done
          [ "$missing" -eq 0 ]
