# Mirror the two dependency images into the org's registry.
#
# Why: the cluster's restrict-image-registries policy (G6) allows only
# ghcr.io/usfali-ke/* inside product namespaces, and frappe-gates-demo needs a
# MariaDB and a Redis. Mirroring keeps the control intact instead of adding a
# Docker Hub exception to it: after this runs, deploy/base/dependencies.yaml
# points at these copies, digest-pinned like everything else.
#
# The mirror has to run here, not on an operator's laptop: pushing a package
# needs write:packages, which this workflow's GITHUB_TOKEN has and a classic
# PAT without that scope does not (GHCR answers "permission_denied: The token
# provided does not match expected scopes").
name: mirror-deps

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Keyless signing needs the Actions OIDC token. Without this line cosign falls
  # back to the interactive device flow and the run dies with
  # "retrieving cert: error obtaining token: expired_token" — the comment below
  # was there but the permission was not.
  id-token: write
  # The mirrored images must satisfy the same G6 policy as the app image
  # (signature + CycloneDX SBOM + SLSA provenance, keyless identity restricted to
  # this repository's workflows), otherwise Argo's sync is denied by
  # verify-image-signatures and the dependency pods never start.

env:
  # Digest only: skopeo refuses "tag@digest" ("Docker references with both a tag
  # and digest are currently not supported"). The tag is applied on the way in,
  # and the digest is what the manifests end up pinning.
  SOURCE_MARIADB: docker.io/library/mariadb@sha256:bb27bde261794d326398a9c998ddf9f35db45296d829123bff829cd076f68107
  SOURCE_REDIS: docker.io/library/redis@sha256:8be847644e195abc4c10c8d9936cfa45332eccc6b714fa7b186ff43f1f4d5579
  # A NEW package name is refused with 403 from GHCR's token endpoint even with
  # packages: write (measured: "Requesting bearer token: invalid status code
  # from registry 403 (Forbidden)" while copying into
  # .../frappe-gates-demo-deps). Mirroring into the package this repo already
  # publishes needs no new grant, and the tags say what they are.
  DEST: ghcr.io/usfali-ke/frappe-gates-demo

jobs:
  mirror:
    name: Mirror MariaDB and Redis into GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # docker pull/tag/push, not skopeo: skopeo asks GHCR for a cross-repo blob
      # mount (library/mariadb -> this repo) and GHCR answers 403 on the token
      # request, which reads as an auth failure but is the mount being refused.
      # Docker pushes the blobs straight into the destination repo.
      - name: Copy both images
        run: |
          set -euo pipefail
          for pair in "dep-mariadb-10.11:${SOURCE_MARIADB}" "dep-redis-7-alpine:${SOURCE_REDIS}"; do
            tag="${pair%%:*}"; src="${pair#*:}"
            echo "=== ${src} -> ${DEST}:${tag}"
            docker pull "${src}"
            docker tag "${src}" "${DEST}:${tag}"
            docker push "${DEST}:${tag}"
          done

      # Direct download, not sigstore/cosign-installer: with
      # `cosign-release: v2.6.5` (the value devsecops-pipeline.yml uses and which
      # works there) the action failed with "cosign versions below v2.0.0 are no
      # longer supported. Requested version: v2.6.5" — the installer's own
      # version parsing, not ours. The binary and the keyless flow are the same.
      - name: Install cosign
        run: |
          set -euo pipefail
          curl -sSL -o /usr/local/bin/cosign \
            https://github.com/sigstore/cosign/releases/download/v2.6.5/cosign-linux-amd64
          chmod +x /usr/local/bin/cosign
          cosign version

      - name: SBOM (syft) and SLSA v1 provenance for the mirrored digests
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mirror"
          for tag in dep-mariadb-10.11 dep-redis-7-alpine; do
            ref="${DEST}:${tag}"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$ref" | cut -d@ -f2)
            # Scan a file, the way the main pipeline does (it hands syft an
            # oci-archive). syft's container cannot open the root-owned docker
            # socket and its registry source answered with an unhelpful exit 1;
            # `docker save` needs neither.
            docker save "${ref}" -o "$RUNNER_TEMP/mirror/${tag}.tar"
            # One writable mount: the previous attempt mounted it :ro and asked
            # syft to write the SBOM into it, which is the exit-1-with-no-message
            # that cost four runs.
            docker run --rm \
              -v "$RUNNER_TEMP/mirror:/data" \
              ghcr.io/anchore/syft:v1.52.0 \
              "docker-archive:/data/${tag}.tar" \
              -q -o cyclonedx-json="/data/${tag}.cdx.json"
            rm -f "$RUNNER_TEMP/mirror/${tag}.tar"
            # Predicate ONLY, no _type/subject wrapper: `cosign attest --type
            # slsaprovenance1` treats the file as the predicate and builds the
            # statement around it, which is how .github/scripts/slsa_predicate.py
            # works for the app image. My earlier full in-toto statement made
            # cosign answer "required field buildDefinition missing".
            python3 - "$ref" "$digest" "$RUNNER_TEMP/mirror/${tag}.slsa.json" <<'PY'
          import json, os, sys

          ref, digest, path = sys.argv[1], sys.argv[2], sys.argv[3]
          e = os.environ
          repo_url = f"{e['GITHUB_SERVER_URL']}/{e['GITHUB_REPOSITORY']}"
          predicate = {
              "buildDefinition": {
                  "buildType": "https://actions.github.io/buildtypes/workflow/v1",
                  "externalParameters": {
                      "workflow": {
                          "ref": e["GITHUB_REF"],
                          "repository": repo_url,
                          "path": ".github/workflows/mirror-deps.yaml",
                      },
                      "mirroredImage": ref,
                  },
                  "internalParameters": {"github": {"event_name": e["GITHUB_EVENT_NAME"], "runner_environment": "github-hosted"}},
                  "resolvedDependencies": [
                      {"uri": f"pkg:docker/{ref}@sha256:{digest.split(':', 1)[1]}"},
                      {"uri": f"git+{repo_url}@{e['GITHUB_REF']}", "digest": {"gitCommit": e["GITHUB_SHA"]}},
                  ],
              },
              "runDetails": {
                  "builder": {"id": f"https://github.com/{e['GITHUB_REPOSITORY']}/actions/runs/{e['GITHUB_RUN_ID']}"},
                  "metadata": {"invocationId": f"{repo_url}/actions/runs/{e['GITHUB_RUN_ID']}"},
              },
          }
          with open(path, "w") as fh:
              json.dump(predicate, fh, indent=2)
          PY
          done

      - name: Sign and attest both digests
        run: |
          set -euo pipefail
          for tag in dep-mariadb-10.11 dep-redis-7-alpine; do
            ref="${DEST}:${tag}"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$ref" | cut -d@ -f2)
            pinned="${DEST}@${digest}"
            echo "=== signing ${pinned}"
            cosign sign --yes "$pinned"
            cosign attest --yes --type cyclonedx --predicate "$RUNNER_TEMP/mirror/${tag}.cdx.json" "$pinned"
            cosign attest --yes --type slsaprovenance1 --predicate "$RUNNER_TEMP/mirror/${tag}.slsa.json" "$pinned"
          done

      # Kyverno verifies signatures by pulling them from the registry with no
      # credentials (this build has no imagePullSecrets on verifyImages — it
      # rejects the field), and a private package makes that read fail with
      # "GET https://ghcr.io/token... DENIED: denied". Public packages are the
      # supported way to let the policy verify; the images carry no secrets.
      - name: Make the package public so signature verification can read it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/vis.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user/packages/container/frappe-gates-demo \
            -d '{"visibility":"public"}')
          echo "visibility PATCH -> ${code}"
          [ "${code}" = "204" ] || { cat /tmp/vis.json; exit 1; }

      - name: Report the digests to point the manifests at
        run: |
          set -euo pipefail
          for tag in dep-mariadb-10.11 dep-redis-7-alpine; do
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${DEST}:${tag}" | cut -d@ -f2)
            echo "${DEST}:${tag}@${digest}"
            echo "- \`${DEST}:${tag}@${digest}\`" >> "$GITHUB_STEP_SUMMARY"
          done
